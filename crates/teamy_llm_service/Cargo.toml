[package]
name = "teamy_llm_service"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
eyre.workspace = true
facet.workspace = true
facet-json.workspace = true
humantime.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
vox = { workspace = true, optional = true }
teamy_llm_core.workspace = true
teamy_llm_burn_qwen35.workspace = true
teamy_llm_makepad_gguf.workspace = true
teamy-cancellation = { workspace = true, features = ["inheritance"] }
