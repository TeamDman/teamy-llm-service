[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = []
vox = ["dep:vox"]
tracy = [
    "teamy_llm_burn_qwen35/tracy",
    "teamy_llm_burn_qwen35/extended_observability",
]
