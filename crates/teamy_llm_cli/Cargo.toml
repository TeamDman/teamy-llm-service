[package]
name = "teamy_llm_cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "teamy-llm"
path = "src/main.rs"

[features]
default = []
tracy = ["dep:tracing-tracy", "teamy_llm_service/tracy"]

[dependencies]
color-eyre.workspace = true
eyre.workspace = true
humantime.workspace = true
facet.workspace = true
figue.workspace = true
facet-pretty.workspace = true
facet-csv.workspace = true
facet-json.workspace = true
teamy_llm_burn_julia.workspace = true
teamy_llm_burn_qwen35.workspace = true
teamy_llm_core.workspace = true
teamy_llm_julia_common.workspace = true
teamy_llm_onnx_julia.workspace = true
teamy_llm_service = { workspace = true, features = ["vox"] }
teamy-cancellation = { workspace = true, features = ["ctrlc", "tracing", "tracing-subscriber", "figue"] }
tracing.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures-util.workspace = true
vox.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unfulfilled_lint_expectations = "deny"

[lints.clippy]
disallowed_macros = "deny"
