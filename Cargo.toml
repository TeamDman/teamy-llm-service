[workspace]
resolver = "3"
exclude = ["vendor/cubecl-common", "vendor/cubecl-cuda"]
members = [
    "crates/teamy_llm_core",
    "crates/teamy_llm_julia_common",
    "crates/teamy_llm_burn_julia",
    "crates/teamy_llm_onnx_julia",
    "crates/teamy_llm_makepad_gguf",
    "crates/teamy_llm_burn_qwen35",
    "crates/teamy_llm_service",
    "crates/teamy_llm_cli",
    "vendor/makepad-ai-loader",
    "vendor/makepad-ai-llm",
    "vendor/makepad-ai-cuda",
]

[workspace.package]
edition = "2024"
authors = ["TeamDman"]
license = "MPL-2.0"
repository = "https://github.com/TeamDman/teamy-llm-service"

[workspace.dependencies]
teamy_llm_core = { path = "crates/teamy_llm_core" }
teamy_llm_julia_common = { path = "crates/teamy_llm_julia_common" }
teamy_llm_burn_julia = { path = "crates/teamy_llm_burn_julia" }
teamy_llm_onnx_julia = { path = "crates/teamy_llm_onnx_julia" }
teamy_llm_makepad_gguf = { path = "crates/teamy_llm_makepad_gguf" }
teamy_llm_burn_qwen35 = { path = "crates/teamy_llm_burn_qwen35" }
teamy_llm_service = { path = "crates/teamy_llm_service" }

arbitrary = { version = "1.4.1", features = ["derive"] }
burn = { version = "0.21.0", default-features = false, features = ["cuda", "ndarray", "std", "store", "record-item-custom-serde"] }
burn-store = "0.21.0"
color-eyre = "0.6.5"
directories-next = "2"
eyre = "0.6.12"
half = "2.7.1"
humantime = "2.2.0"
memmap2 = "0.9.9"
libloading = "=0.9.0"
makepad-ai-llm = { path = "vendor/makepad-ai-llm" }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "cuda", "api-24"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
safetensors = "0.7.0"
sha2 = "=0.10.9"
teamy-cancellation = { git = "https://github.com/TeamDman/teamy-cancellation.git", tag = "v0.3.1", default-features = false }
tempfile = "3.20.0"
tokio = { version = "1.49.0", features = ["full"] }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
tracing = "0.1.41"
tracing-error = "=0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracy-client = { version = "0.18.4", default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }
tracing-tracy = { version = "0.11", default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }

facet = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet", features = ["reflect"] }
facet-json = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet-json" }
facet-csv = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet-csv" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet-pretty", default-features = false }
figue = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "figue", features = ["arbitrary"] }
vox = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "vox" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.32"

# CUDA and Metal also consume loader types. Keep one loader identity throughout
# the pinned Makepad graph while leaving their numerical implementations intact.
[patch."https://github.com/makepad/makepad"]
makepad-ai-loader = { path = "vendor/makepad-ai-loader" }
makepad-ai-cuda = { path = "vendor/makepad-ai-cuda" }

# Preserve the resolved CubeCL versions; recover cache corruption/I/O failures locally.
[patch.crates-io]
cubecl-common = { path = "vendor/cubecl-common" }
cubecl-cuda = { path = "vendor/cubecl-cuda" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.teamy_llm_cli]
opt-level = 1

[profile.dev.package.teamy_llm_burn_qwen35]
opt-level = 1
