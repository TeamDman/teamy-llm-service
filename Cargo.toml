[workspace]
resolver = "3"
members = [
    "crates/teamy_llm_core",
    "crates/teamy_llm_burn_qwen35",
    "crates/teamy_llm_service",
    "crates/teamy_llm_cli",
]

[workspace.package]
edition = "2024"
authors = ["TeamDman"]
license = "MPL-2.0"
repository = "https://github.com/TeamDman/teamy-llm-service"

[workspace.dependencies]
teamy_llm_core = { path = "crates/teamy_llm_core" }
teamy_llm_burn_qwen35 = { path = "crates/teamy_llm_burn_qwen35" }
teamy_llm_service = { path = "crates/teamy_llm_service" }

arbitrary = { version = "1.4.1", features = ["derive"] }
burn = { version = "0.21.0", default-features = false, features = ["cuda", "ndarray", "std", "store", "record-item-custom-serde"] }
burn-store = "0.21.0"
color-eyre = "0.6.5"
directories-next = "2"
eyre = "0.6.12"
half = "2.7.1"
humantime = "2.2.0"
memmap2 = "0.9.9"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
safetensors = "0.7.0"
teamy-cancellation = { git = "https://github.com/TeamDman/teamy-cancellation.git", tag = "v0.3.1", default-features = false }
tempfile = "3.20.0"
tokio = { version = "1.49.0", features = ["full"] }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracy-client = { version = "0.18.4", default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }

facet = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet", features = ["reflect"] }
facet-json = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet-json" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "facet-pretty", default-features = false }
figue = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "figue", features = ["arbitrary"] }
vox = { git = "https://github.com/TeamDman/facet.git", rev = "d0c3140ec6683f80249d50d74fa073911e0dfeb9", package = "vox" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.teamy_llm_cli]
opt-level = 1

[profile.dev.package.teamy_llm_burn_qwen35]
opt-level = 1
