[project]
name = "teamy-julia-reference"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0+cu128",
    "transformers==5.0.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "numpy==2.4.6",
    "huggingface-hub==1.16.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
